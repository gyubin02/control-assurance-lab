[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "control-assurance-lab"
version = "0.1.0"
description = "Reproducible experiments that expose security-control failures masked by safe outcomes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Gyubin Lee" },
]
keywords = [
  "control assurance",
  "evidence",
  "reproducible security",
  "security testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=46,<47",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "rfc8785>=0.1.4,<1",
]

[project.scripts]
assurance-lab = "assurance_lab.cli:main"

[project.urls]
Documentation = "https://gyubin02.github.io/control-assurance-lab/"
Issues = "https://github.com/gyubin02/control-assurance-lab/issues"
Repository = "https://github.com/gyubin02/control-assurance-lab"

[project.optional-dependencies]
dev = [
  "hatchling>=1.26,<2",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assurance_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["assurance_lab"]
